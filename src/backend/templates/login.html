{% extends "base.html" %}
{% block title %}Admin Login - KOSPI200{% endblock %}

{% block content %}
<div class="row justify-content-center" style="margin-top:80px">
  <div class="col-md-5 col-lg-4">
    <div class="card">
      <div class="card-body p-4">
        <div class="text-center mb-4">
          <i class="bi bi-shield-lock" style="font-size:48px; color:#667eea"></i>
          <h3 class="mt-2">Admin Login</h3>
          <p class="text-muted">관리자 전용 로그인</p>
        </div>
        <form id="login-form">
          <div class="mb-3">
            <label class="form-label">Username</label>
            <input type="text" class="form-control" id="username" required autocomplete="username">
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" class="form-control" id="password" required autocomplete="current-password">
          </div>
          <div id="error-msg" class="alert alert-danger py-2" style="display:none"></div>
          <button type="submit" class="btn btn-primary w-100" id="login-btn">
            <i class="bi bi-box-arrow-in-right"></i> Login
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
// 이미 로그인된 경우 admin으로 이동
if (localStorage.getItem('access_token')) {
  window.location.href = '/admin';
}

document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errEl = document.getElementById('error-msg');
  const btn = document.getElementById('login-btn');
  errEl.style.display = 'none';
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Logging in...';

  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        username: document.getElementById('username').value,
        password: document.getElementById('password').value,
      })
    });
    if (!res.ok) throw new Error('아이디 또는 비밀번호가 올바르지 않습니다.');
    const data = await res.json();
    localStorage.setItem('access_token', data.access_token);
    localStorage.setItem('refresh_token', data.refresh_token);
    window.location.href = '/admin';
  } catch (err) {
    errEl.textContent = err.message;
    errEl.style.display = 'block';
    btn.disabled = false;
    btn.innerHTML = '<i class="bi bi-box-arrow-in-right"></i> Login';
  }
});
</script>
{% endblock %}
