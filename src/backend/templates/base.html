<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>{% block title %}KOSPI200 Ranking{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/common.css">
  {% block head %}{% endblock %}
</head>
<body>
  <input type="checkbox" id="themeToggle" class="theme-toggle-checkbox">
  <div class="app-shell">
    <nav class="navbar navbar-expand-lg navbar-light app-navbar">
      <div class="container-main navbar-shell">
        <a class="navbar-brand app-brand" href="/">
          <span class="brand-mark"><i class="bi bi-bar-chart-line"></i></span>
          <span class="brand-copy">
            <strong>KOSPI200</strong>
            <small>Ranking Intelligence</small>
          </span>
        </a>

        <div class="navbar-meta">
          <label class="theme-toggle" for="themeToggle" aria-label="다크 모드 전환">
            <span class="theme-toggle-track">
              <i class="bi bi-sun-fill theme-icon theme-icon-light"></i>
              <i class="bi bi-moon-stars-fill theme-icon theme-icon-dark"></i>
              <span class="theme-toggle-thumb"></span>
            </span>
            <span class="theme-toggle-text">다크 모드</span>
          </label>

          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="메뉴 열기">
            <span class="navbar-toggler-icon"></span>
          </button>
        </div>

        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto app-nav">
            <li class="nav-item">
              <a class="nav-link" href="/rankings">
                <i class="bi bi-trophy"></i>
                <span>Rankings</span>
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/backtest">
                <i class="bi bi-graph-up-arrow"></i>
                <span>Backtest</span>
              </a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="app-main">
      <div class="container-main">
        {% block content %}{% endblock %}
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
